# Build the atlases and the web viewer, and publish web/ to GitHub Pages at
# https://erik-larsen.github.io/big-text/. The two corpora are built here
# from the repository itself: War and Peace from the committed Gutenberg
# text, and big-text's own source, with the whole history for its tint.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0              # the churn tint reads the whole git log
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          # PyOpenGL and glfw load their libraries on import, and the exporter
          # imports the viewer's module
          sudo apt-get install -y --no-install-recommends libgl1 libegl1
          pip install -r requirements.txt
      - name: Atlases
        run: |
          ./atlas_index.py . --out data/big-text_atlas
          ./atlas_layout.py data/big-text_atlas
          ./book_index.py --gutenberg 2600 --out data/war-and-peace_atlas
          ./atlas_layout.py data/war-and-peace_atlas
          mkdir -p web/data
          for name in big-text war-and-peace; do
            ./atlas_export.py data/${name}_atlas --gzip
            cp data/${name}_atlas/viewer.bin.gz web/data/$name.bin.gz
          done
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 4.0.13
      - name: Web viewer
        run: |
          ./c/build_web.sh
          # the page asks for this build's .js, .wasm and atlases together
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" web/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
